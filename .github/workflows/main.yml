name: Linux VNC (GitHub Runner - Stable)

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Update system
      run: |
        sudo apt update

    - name: Install VNC and xterm
      run: |
        sudo apt install -y \
          tigervnc-standalone-server tigervnc-common \
          xterm

    - name: Set VNC password
      run: |
        mkdir -p ~/.vnc
        echo -e "github\ngithub\n" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

    - name: Start VNC server (NO xstartup)
      run: |
        vncserver -kill :1 || true
        vncserver -localhost no :1 -xstartup /usr/bin/xterm

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      run: |
        sudo tailscale up \
          --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
          --hostname=gh-linux-vnc-${{ github.run_id }}

    - name: Connection info
      run: |
        echo "======================================"
        echo "VNC READY (xterm only)"
        echo "Port     : 5901"
        echo "Password : github"
        echo "IP:"
        tailscale ip -4
        echo "======================================"

    - name: Keep runner alive
      run: |
        while true; do
          echo "[INFO] VNC session active..."
          sleep 300
        done
