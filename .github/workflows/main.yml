name: Linux VNC (Stable)

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Update system
      run: |
        sudo apt update

    - name: Install VNC + X utilities
      run: |
        sudo apt install -y \
          tigervnc-standalone-server tigervnc-common \
          xterm x11-xserver-utils dbus-x11

    - name: Setup VNC password
      run: |
        mkdir -p ~/.vnc
        echo -e "github\ngithub\n" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

    - name: Create xstartup (STABLE)
      run: |
        cat << 'EOF' > ~/.vnc/xstartup
        #!/bin/sh
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        exec xterm &
        EOF
        chmod +x ~/.vnc/xstartup

    - name: Start VNC server
      run: |
        vncserver -localhost no :1

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      run: |
        sudo tailscale up \
          --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
          --hostname=gh-linux-vnc-${{ github.run_id }}

    - name: Show connection info
      run: |
        echo "======================================"
        echo "VNC READY (xterm only)"
        echo "Port     : 5901"
        echo "Password : github"
        echo "IP       :"
        tailscale ip -4
        echo "======================================"

    - name: Keep runner alive
      run: |
        while true; do
          echo "[INFO] VNC session running..."
          sleep 300
        done
