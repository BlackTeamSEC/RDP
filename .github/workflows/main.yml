name: Linux XFCE Desktop

on:
  workflow_dispatch:

jobs:
  linux-xfce:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Update system
      run: |
        sudo apt update

    - name: Install XFCE desktop
      run: |
        sudo apt install -y xfce4 xfce4-goodies dbus-x11

    - name: Install TigerVNC
      run: |
        sudo apt install -y tigervnc-standalone-server tigervnc-common

    - name: Setup VNC password
      run: |
        mkdir -p ~/.vnc
        echo -e "github\ngithub\n" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

    - name: Configure XFCE session
      run: |
        cat << 'EOF' > ~/.vnc/xstartup
        #!/bin/sh
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        exec startxfce4 &
        EOF
        chmod +x ~/.vnc/xstartup

    - name: Start VNC server
      run: |
        vncserver -localhost no :1

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      run: |
        sudo tailscale up \
          --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
          --hostname=gh-linux-xfce-${{ github.run_id }}

    - name: Show connection info
      run: |
        echo "=================================="
        echo "XFCE Linux Desktop Ready"
        echo "VNC Address: <TAILSCALE_IP>:5901"
        echo "VNC Password: github"
        echo "=================================="
        tailscale ip -4

    - name: Keep runner alive
      run: |
        while true; do
          echo "[INFO] XFCE session active..."
          sleep 300
        done
